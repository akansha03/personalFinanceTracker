apiVersion: apps/v1
kind: Deployment
metadata:
  name: pfin-app
  namespace: pfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pfin-app
  template:
    metadata:
      labels:
        app: pfin-app
    spec:
      containers:
        - name: pfin-app
          image: akanshadoc03/pfin:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/pfin
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pfin-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pfin-db-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pfin-app
  namespace: pfin
spec:
  selector:
    app: pfin-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: NodePort